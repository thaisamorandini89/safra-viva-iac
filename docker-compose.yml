services:
  db:
    image: postgres:16
    container_name: postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: senha_segura
      POSTGRES_DB: safra_db
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: flask_backend
    # Sincronização em tempo real: o que você salvar localmente, reflete no container
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://admin:senha_segura@db:5432/safra_db
    # Chave do Gemini e config do SafraIA (arquivo fora do git)
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      - db
    ports:
      - "5000:5000"

  frontend:
    build: ./frontendweb
    container_name: react_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontendweb:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin_web
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: senha_admin
    ports:
      - "8081:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  pgdata:
  pgadmin_data: